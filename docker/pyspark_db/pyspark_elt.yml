# version: '4'

services:

    jupyter:
      image: drhazem95/pyspark_db_python:v1.4
      container_name: pyspark-db
      hostname: pyspark_etl
      ports:
        - "8888:8888"
      restart: always
      volumes:
        - myvol_elt:/home/jovyan/work
        - /home/hazem/mds_datapipline_elt/scripts:/home/jovyan/code
      working_dir: /home/jovyan/code
      networks:
        - shared_net

    mysql_db:
      image: mysql:8.0.41-debian
      hostname: mysql_db
      container_name: mysql-db
      ports:
        - 3306:3306
        - 33060:33060
      restart: always
      networks:
        - shared_net
      command: --default-authentication-plugin=mysql_native_password --secure-file-priv=""
      environment:
        MYSQL_ROOT_PASSWORD: "P@ssw0rd" #default username will be root 
      volumes:
        - /home/hazem/mds_datapipline_elt/datasets:/usr/datasets/
        - myvol_elt:/usr/databases/


    mysql-workbench:
      image: linuxserver/mysql-workbench:latest
      container_name: mysql-workbench
      hostname: mysql-workbench
      environment:
        - PUID=1000
        - PGID=1000
      volumes:
        - /home/hazem/mds_datapipline_elt/datasets:/usr/datasets/
        - myvol_elt:/usr/databases/
      ports:
        - 3000:3000
      cap_add:
        - IPC_LOCK
      restart: unless-stopped
      networks: 
        - shared_net

    postgres_db:
      image: postgres
      restart: always
      container_name: pg-db
      hostname: pg_db
      environment: 
        POSTGRES_PASSWORD: "P@ssw0rd"  #default username will be postgres
      volumes:
        - /home/hazem/mds_datapipline_elt/datasets:/usr/datasets/
        - myvol_elt:/usr/databases/
      ports:
        - 6000:5432
      networks: 
        - shared_net

    pg_admin:
      image: dpage/pgadmin4:latest
      container_name: pg_admin
      hostname: pg_admin
      environment:
        PGADMIN_DEFAULT_EMAIL: hazemomar@gmail.com
        PGADMIN_DEFAULT_PASSWORD: hazem95
      ports:
        - "7000:80"
      depends_on:
        - postgres_db
      restart: always
      volumes:
        - /home/hazem/mds_datapipline_elt/datasets:/usr/datasets/
        - myvol_elt:/usr/databases/
      networks:
        - shared_net
      
    mssql:
      image: mcr.microsoft.com/mssql/server:2019-latest
      container_name: mssql-server
      hostname: mssql_server
      ports:
        - 1433:1433
      restart: always
      environment:
        ACCEPT_EULA: "Y"
        SA_PASSWORD: "hazemomar95!" 
        MSSQL_PID: "Express"   
      volumes:
        - /home/hazem/mds_datapipline_elt/datasets:/usr/datasets/
        - myvol_elt:/usr/databases/
      networks:
        - shared_net

networks:
   shared_net:
      external: true

volumes:
  myvol_elt: